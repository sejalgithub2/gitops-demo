apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-master-motd
  labels:
    machineconfiguration.openshift.io/role: master
spec:
  config:
    ignition:
      version: 3.5.0
    storage:
      files:
      - path: /etc/motd
        mode: 0444
        overwrite: true
        contents:
          source: data:text/plain;charset=utf-8;base64,
